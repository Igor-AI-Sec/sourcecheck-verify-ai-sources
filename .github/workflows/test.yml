name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in sourcecheck/*.js sourcecheck/lib/*.js tests/*.js; do
            node --check "$f"
          done
      - name: Tests
        run: npm test
